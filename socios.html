<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socios · Sociedad de Colombicultura Virgen del Rosario de Lorquí</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{--red:#c8101e;--dark:#9e0b15;--line:#f0d4d7;--muted:#6e5f61}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#28181a;background:#fff}.top{background:var(--red);color:#fff;padding:10px 5%;font-weight:800}.head{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-weight:900;color:var(--dark)}.back{padding:10px 14px;border:1px solid #efc4c8;border-radius:999px;color:var(--red);text-decoration:none;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:38px 5%}.tabs{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}.tabs a{padding:10px 16px;border:1px solid #efc4c8;border-radius:999px;text-decoration:none;font-weight:900;color:var(--red)}.tabs .active{background:var(--red);color:#fff;border-color:var(--red)}h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,52px);margin:0 0 10px}.lead{color:var(--muted);margin:0 0 24px}.count{font-weight:800;color:var(--muted);margin-bottom:12px}.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}.members{width:100%;border-collapse:collapse;background:#fff}.members th,.members td{padding:13px 16px;border-bottom:1px solid #f3e4e6;text-align:left}.members th{background:var(--red);color:#fff;text-transform:uppercase;font-size:13px;letter-spacing:.04em}.members td:first-child{width:120px;font-weight:900;color:var(--red)}.status{padding:22px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-weight:700;background:#fff8f8}@media(max-width:600px){.members th,.members td{padding:11px 10px}.members td:first-child{width:90px}}</style></head><body><div class="top">Sociedad de Colombicultura Virgen del Rosario de Lorquí</div><div class="head"><div class="brand">SOCIEDAD · LORQUÍ</div><a class="back" href="index.html#sociedad">← Volver a la web</a></div><main class="wrap"><div class="tabs"><a href="index.html#sociedad">La Sociedad</a><a class="active" href="socios.html">Socios</a></div><h1>Socios</h1><p class="lead">Listado de socios de la Sociedad de Colombicultura Virgen del Rosario de Lorquí.</p><div id="members"><div class="status">Cargando listado de socios…</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));async function load(){const box=document.getElementById('members');try{let excel='/uploads/socios.xlsx';try{const r=await fetch('/content/members.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.excel)excel=j.excel}}catch(e){}const r=await fetch(excel,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el Excel de socios');const ab=await r.arrayBuffer();let wb;try{wb=XLSX.read(ab,{type:'array',cellFormula:false,cellText:true})}catch(firstError){try{const bin=Array.from(new Uint8Array(ab),b=>String.fromCharCode(b)).join('');wb=XLSX.read(bin,{type:'binary',cellFormula:false,cellText:true})}catch(secondError){throw new Error('No se puede leer este archivo. Vuelve a guardarlo como Libro de Excel (.xlsx) y súbelo de nuevo.')}}const ws=wb.Sheets[wb.SheetNames[0]];if(!ws)throw new Error('El Excel no contiene ninguna hoja');const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});const rows=data.map(r=>[String(r[0]??'').trim(),String(r[1]??'').trim()]).filter(r=>r[0]!==''&&r[1]!==''&&!isNaN(Number(r[0])));if(!rows.length)throw new Error('No se encontraron socios en las columnas A y B');box.innerHTML='<div class="count">'+rows.length+' socios</div><div class="tableWrap"><table class="members"><thead><tr><th>Nº socio</th><th>Socio / Peña</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){box.innerHTML='<div class="status">⚠️ '+esc(e.message||'No se pudo cargar el listado de socios')+'</div>'}}load();</script></body></html>
